<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TikTok action fixture</title>
    <style>
      body { margin: 0; background: #111; color: #fff; font-family: Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 90px; width: 520px; height: 360px; }
      video, .video-box { width: 410px; height: 300px; background: #222; display: block; }
      .actions { display: flex; align-items: center; justify-content: center; }
      button { width: 54px; height: 54px; border-radius: 999px; border: 0; background: #333; color: white; }
      button[aria-pressed="true"] svg { fill: rgb(254, 44, 85); color: rgb(254, 44, 85); }
      svg { width: 28px; height: 28px; fill: rgb(255, 255, 255); }
      .comment-row { display: flex; gap: 8px; padding: 12px; }
      textarea { width: 330px; height: 44px; }
      .live-bar { padding: 12px; display: flex; gap: 12px; align-items: center; }
      .live-surface { width: 180px; height: 96px; background: #181818; border: 1px solid #444; }
      #live-like-button { width: 48px; height: 48px; background: #222; }
    </style>
  </head>
  <body>
    <main data-e2e="video-detail-container">
      <div class="video-box" data-e2e="browse-video"></div>
      <div class="actions">
        <button id="like-button" aria-label="Like" aria-pressed="false">
          <span data-e2e="browse-like-icon">
            <svg viewBox="0 0 24 24"><path d="M12 21s-8-4.7-8-11a5 5 0 0 1 8-3 5 5 0 0 1 8 3c0 6.3-8 11-8 11z"></path></svg>
          </span>
        </button>
      </div>
    </main>
    <div class="comment-row">
      <textarea data-e2e="comment-input" placeholder="Add comment"></textarea>
      <button id="post-comment" data-e2e="comment-post">Post</button>
    </div>
    <div class="live-bar">
      <div id="live-surface" class="live-surface" data-e2e="live-player"></div>
      <button id="live-like-button" data-e2e="room-chat-like-btn" aria-label="Tap to like live">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8-4.7-8-11a5 5 0 0 1 8-3 5 5 0 0 1 8 3c0 6.3-8 11-8 11z"></path></svg>
      </button>
    </div>
    <script>
      window.__likeClicks = 0;
      window.__liveLikeClicks = 0;
      window.__liveScreenTaps = 0;
      window.__postedComment = '';
      document.getElementById('like-button').addEventListener('click', event => {
        window.__likeClicks += 1;
        const button = event.currentTarget;
        button.setAttribute('aria-pressed', button.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
      document.getElementById('post-comment').addEventListener('click', () => {
        window.__postedComment = document.querySelector('[data-e2e="comment-input"]').value;
      });
      document.getElementById('live-like-button').addEventListener('click', () => {
        window.__liveLikeClicks += 1;
      });
      document.getElementById('live-surface').addEventListener('click', () => {
        window.__liveScreenTaps += 1;
      });
    </script>
  </body>
</html>
